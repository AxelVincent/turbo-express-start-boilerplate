apiVersion: 1

providers:
  # Dashboards dropped into ./json are provisioned into this folder. Rename
  # both when you rename the project.
  - name: "Boilerplate Dashboards"
    orgId: 1
    folder: "Boilerplate"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
