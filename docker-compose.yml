  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=${PGUSER}
      - POSTGRES_PASSWORD=${PGPASSWORD}
      - POSTGRES_DB=${PGDATABASE}
    command: -p 5433
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${PGPORT}:5433"
    networks:
      - app_network

  redis:
    image: redis/redis-stack-server:7.2.0-v17
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data/redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --user
      - ${REDIS_USER}
      - on
      - ">${REDIS_PASSWORD}"
      - allcommands
      - allkeys
      # BullMQ's event stream uses pub/sub, which is denied without this.
      - allchannels
      - --appendonly
      - yes
      - --loadmodule
      - /opt/redis-stack/lib/rejson.so
    environment:
      - REDIS_USER=${REDIS_USER}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      # --user, not -u: redis-cli's -u takes a connection URI, so passing a
      # username there makes the check fail against an otherwise healthy server.
      test:
        [
          "CMD",
          "redis-cli",
          "--user",
          "${REDIS_USER}",
          "--pass",
          "${REDIS_PASSWORD}",
          "ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - app_network

  loki:
    image: grafana/loki:3.4.2
    ports:
      - "${LOKI_PORT}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app_network

  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "${PROMETHEUS_PORT}:9090"
    # Docker Desktop resolves host.docker.internal already; Linux does not, so
    # map it explicitly to let Prometheus scrape the API running on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    restart: unless-stopped
    networks:
      - app_network

  tempo:
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "${TEMPO_PORT}:3200"
      - "${TEMPO_OTLP_HTTP_PORT}:4318"
      - "${TEMPO_OTLP_GRPC_PORT}:4317"
    volumes:
      - ./packages/metrics/tempo/tempo.yaml:/etc/tempo/tempo.yaml
      - tempo-data:/var/tempo
    restart: unless-stopped
    networks:
      - app_network

  grafana:
    image: grafana/grafana:11.5.2
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    user: "472"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./packages/metrics/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - app_network

volumes:
  postgres_data:
  redis_data:
  grafana-data:
  prometheus-data:
  tempo-data:

networks:
  app_network:
    external: true
